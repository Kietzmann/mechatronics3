[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mechatronics3"
version = "0.1.0"
description = "Simple mobile robot based on Arduino, Python, pyFirmata and scikit-learn"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.14"
keywords = ["arduino", "robotics", "pyfirmata", "scikit-learn", "mobile-robot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pyfirmata",
    "numpy",
    "scikit-learn",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
vision = ["opencv-python"]
server = ["fastapi", "uvicorn[standard]", "jinja2", "python-multipart"]
dev = ["pytest", "ruff", "pre-commit", "httpx"]

[project.scripts]
mechatronics3 = "mechatronics3.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mechatronics3"]

[tool.ruff]
target-version = "py314"
line-length = 131
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"src/mechatronics3/server/routes/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
