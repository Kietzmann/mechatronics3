<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mechatronics3 – Dashboard</title>
    <style>
        :root {
            --bg: #0f1117;
            --surface: #1a1d2e;
            --surface-hover: #232740;
            --border: #2a2e42;
            --accent: #6c63ff;
            --accent-hover: #5a52e0;
            --success: #4ecca3;
            --danger: #e94560;
            --warn: #f0a500;
            --text: #e4e4e7;
            --text-muted: #9ca3af;
            --radius: 12px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        header h1 { font-size: 1.4rem; font-weight: 600; letter-spacing: -0.02em; }
        header h1 span { color: var(--accent); }

        .auth-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .auth-row label { font-size: 0.85rem; color: var(--text-muted); }

        input, select {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 6px;
            padding: 0.45rem 0.65rem;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus { border-color: var(--accent); }

        main {
            max-width: 1280px;
            margin: 0 auto;
            padding: 1.5rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 1.25rem;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .card h2 {
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card h2 .icon { font-size: 1.15rem; }

        button {
            cursor: pointer;
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 0.5rem 1rem;
            transition: background 0.15s, transform 0.1s;
            color: #fff;
            background: var(--accent);
        }

        button:hover { background: var(--accent-hover); }
        button:active { transform: scale(0.97); }
        button.danger { background: var(--danger); }
        button.danger:hover { background: #d13350; }
        button.success { background: var(--success); color: #000; }
        button.success:hover { background: #3db88f; }
        button.warn { background: var(--warn); color: #000; }
        button.warn:hover { background: #d89200; }

        /* Motor pad */
        .motor-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            max-width: 280px;
        }

        .motor-grid button { padding: 0.7rem 0; font-size: 0.8rem; }
        .motor-grid .center-btn { background: var(--danger); }
        .motor-grid .center-btn:hover { background: #d13350; }

        .row { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }

        .slider-group { flex: 1; min-width: 180px; }
        .slider-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.3rem; }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: var(--border);
            border: none;
            padding: 0;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
        }

        .output {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem;
            font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace;
            font-size: 0.8rem;
            color: var(--text-muted);
            max-height: 180px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .file-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .file-list li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg);
            padding: 0.4rem 0.7rem;
            border-radius: 6px;
            font-size: 0.8rem;
        }

        .file-list li .actions { display: flex; gap: 0.4rem; }
        .file-list li button { padding: 0.25rem 0.6rem; font-size: 0.75rem; }

        @media (max-width: 500px) {
            main { padding: 0.75rem; grid-template-columns: 1fr; }
            header { padding: 0.75rem 1rem; }
        }
    </style>
</head>
<body>
    <header>
        <h1><span>Mechatronics3</span> Dashboard</h1>
        <div class="auth-row">
            <label for="token">Auth Token</label>
            <input id="token" type="password" placeholder="bearer token" style="width:200px">
        </div>
    </header>

    <main>
        <!-- Motor Control -->
        <div class="card">
            <h2><span class="icon">&#9881;</span> Motor Control</h2>
            <div class="row">
                <label style="font-size:0.8rem;color:var(--text-muted)">Duration (s)</label>
                <input id="motor-dur" type="number" value="1" min="0" max="30" step="0.1" style="width:80px">
            </div>
            <div class="motor-grid">
                <button onclick="motor('left_forward')">&#8598; LF</button>
                <button onclick="motor('forward')">&#8593; Fwd</button>
                <button onclick="motor('right_forward')">&#8599; RF</button>
                <button onclick="motor('left_backward')">&#8601; LB</button>
                <button class="center-btn" onclick="motor('stop')">&#9632; Stop</button>
                <button onclick="motor('right_backward')">&#8600; RB</button>
                <div></div>
                <button onclick="motor('backward')">&#8595; Bwd</button>
                <div></div>
            </div>
            <div class="row">
                <label style="font-size:0.8rem;color:var(--text-muted)">Rotate angle</label>
                <input id="rotate-angle" type="number" value="65" min="0" max="180" style="width:70px">
                <button onclick="rotate()">Rotate</button>
            </div>
            <div class="output" id="motor-out">Ready</div>
        </div>

        <!-- Servo Control -->
        <div class="card">
            <h2><span class="icon">&#8634;</span> Servo Control</h2>
            <div class="slider-group">
                <label>Horizontal: <strong id="h-val">90</strong>&deg;</label>
                <input type="range" id="servo-h" min="0" max="180" value="90" oninput="document.getElementById('h-val').textContent=this.value">
            </div>
            <div class="slider-group">
                <label>Vertical: <strong id="v-val">90</strong>&deg;</label>
                <input type="range" id="servo-v" min="0" max="180" value="90" oninput="document.getElementById('v-val').textContent=this.value">
            </div>
            <div class="row">
                <button onclick="setServo('horizontal')">Set H</button>
                <button onclick="setServo('vertical')">Set V</button>
                <button class="success" onclick="centerServos()">Center</button>
                <button onclick="readServos()">Read</button>
            </div>
            <div class="output" id="servo-out">Ready</div>
        </div>

        <!-- Sensor -->
        <div class="card">
            <h2><span class="icon">&#128225;</span> Sensor</h2>
            <div class="row">
                <button onclick="sensorPing()">Ping</button>
                <button onclick="sensorScan()">Scan 2D</button>
                <button onclick="sensorScan3D()">Scan 3D</button>
            </div>
            <div class="output" id="sensor-out">Ready</div>
        </div>

        <!-- Colour Detection -->
        <div class="card">
            <h2><span class="icon">&#127912;</span> Colour Detection</h2>
            <div class="row">
                <div class="slider-group">
                    <label>H: <input id="cd-hmin" type="number" value="0" min="0" max="180" style="width:55px"> &ndash; <input id="cd-hmax" type="number" value="180" min="0" max="180" style="width:55px"></label>
                </div>
                <div class="slider-group">
                    <label>S: <input id="cd-smin" type="number" value="0" min="0" max="255" style="width:55px"> &ndash; <input id="cd-smax" type="number" value="255" min="0" max="255" style="width:55px"></label>
                </div>
                <div class="slider-group">
                    <label>V: <input id="cd-vmin" type="number" value="0" min="0" max="255" style="width:55px"> &ndash; <input id="cd-vmax" type="number" value="255" min="0" max="255" style="width:55px"></label>
                </div>
            </div>
            <button onclick="detectColor()">Detect</button>
            <div class="output" id="color-out">Ready</div>
        </div>

        <!-- ML Detection -->
        <div class="card">
            <h2><span class="icon">&#129302;</span> ML Detection</h2>
            <div class="row">
                <button onclick="mlStatus()">Status</button>
                <button class="warn" onclick="mlPredict()">Predict</button>
            </div>
            <label style="font-size:0.8rem;color:var(--text-muted)">Detection vector (comma-separated 0/1)</label>
            <input id="ml-vec" type="text" placeholder="0,1,0,1,1,0,...">
            <div class="output" id="ml-out">Ready</div>
        </div>

        <!-- File Management -->
        <div class="card">
            <h2><span class="icon">&#128193;</span> File Management</h2>
            <div class="row">
                <input id="file-input" type="file" accept=".py">
                <button onclick="uploadFile()">Upload</button>
                <button onclick="listFiles()">Refresh</button>
            </div>
            <ul class="file-list" id="file-list"></ul>
            <div class="output" id="file-out">Ready</div>
        </div>
    </main>

    <script>
        function tok() { return document.getElementById("token").value; }
        function hdr() { return { "Authorization": "Bearer " + tok(), "Content-Type": "application/json" }; }

        async function api(method, path, body) {
            const opts = { method, headers: hdr() };
            if (body !== undefined) opts.body = JSON.stringify(body);
            const res = await fetch(path, opts);
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || res.statusText);
            return data;
        }

        function out(id, msg) { document.getElementById(id).textContent = typeof msg === "string" ? msg : JSON.stringify(msg, null, 2); }

        /* Motor */
        async function motor(action) {
            try {
                const dur = parseFloat(document.getElementById("motor-dur").value) || 1;
                const data = await api("POST", "/api/robot/motor/" + action, { duration: dur });
                out("motor-out", data);
            } catch (e) { out("motor-out", "Error: " + e.message); }
        }
        async function rotate() {
            try {
                const angle = parseFloat(document.getElementById("rotate-angle").value) || 65;
                const data = await api("POST", "/api/robot/motor/rotate", { angle });
                out("motor-out", data);
            } catch (e) { out("motor-out", "Error: " + e.message); }
        }

        /* Servo */
        async function setServo(axis) {
            try {
                const angle = parseInt(document.getElementById("servo-" + axis[0]).value, 10);
                const data = await api("POST", "/api/robot/servo/" + axis, { angle });
                out("servo-out", data);
            } catch (e) { out("servo-out", "Error: " + e.message); }
        }
        async function centerServos() {
            try { out("servo-out", await api("POST", "/api/robot/servo/center")); }
            catch (e) { out("servo-out", "Error: " + e.message); }
        }
        async function readServos() {
            try { out("servo-out", await api("GET", "/api/robot/servo")); }
            catch (e) { out("servo-out", "Error: " + e.message); }
        }

        /* Sensor */
        async function sensorPing() {
            try { out("sensor-out", await api("GET", "/api/robot/sensor/ping")); }
            catch (e) { out("sensor-out", "Error: " + e.message); }
        }
        async function sensorScan() {
            try { out("sensor-out", await api("GET", "/api/robot/sensor/scan")); }
            catch (e) { out("sensor-out", "Error: " + e.message); }
        }
        async function sensorScan3D() {
            try { out("sensor-out", await api("GET", "/api/robot/sensor/scan3d")); }
            catch (e) { out("sensor-out", "Error: " + e.message); }
        }

        /* Color detection */
        async function detectColor() {
            try {
                const q = new URLSearchParams({
                    h_min: document.getElementById("cd-hmin").value,
                    h_max: document.getElementById("cd-hmax").value,
                    s_min: document.getElementById("cd-smin").value,
                    s_max: document.getElementById("cd-smax").value,
                    v_min: document.getElementById("cd-vmin").value,
                    v_max: document.getElementById("cd-vmax").value,
                });
                out("color-out", await api("GET", "/api/detection/color?" + q));
            } catch (e) { out("color-out", "Error: " + e.message); }
        }

        /* ML */
        async function mlStatus() {
            try { out("ml-out", await api("GET", "/api/detection/ml/status")); }
            catch (e) { out("ml-out", "Error: " + e.message); }
        }
        async function mlPredict() {
            try {
                const vec = document.getElementById("ml-vec").value.split(",").map(Number);
                out("ml-out", await api("POST", "/api/detection/ml/predict", { detections: vec }));
            } catch (e) { out("ml-out", "Error: " + e.message); }
        }

        /* Files */
        async function listFiles() {
            try {
                const files = await api("GET", "/api/files/");
                const ul = document.getElementById("file-list");
                ul.innerHTML = "";
                files.forEach(f => {
                    const li = document.createElement("li");
                    li.innerHTML = `<span>${f.name} <small>(${f.size} B)</small></span>
                        <span class="actions">
                            <button onclick="execFile('${f.name}')">Run</button>
                            <button class="danger" onclick="delFile('${f.name}')">Del</button>
                        </span>`;
                    ul.appendChild(li);
                });
                if (!files.length) out("file-out", "No files uploaded");
            } catch (e) { out("file-out", "Error: " + e.message); }
        }

        async function uploadFile() {
            try {
                const input = document.getElementById("file-input");
                if (!input.files.length) { out("file-out", "Select a file first"); return; }
                const form = new FormData();
                form.append("file", input.files[0]);
                const res = await fetch("/api/files/upload", {
                    method: "POST",
                    headers: { "Authorization": "Bearer " + tok() },
                    body: form,
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || res.statusText);
                out("file-out", data);
                listFiles();
            } catch (e) { out("file-out", "Error: " + e.message); }
        }

        async function execFile(name) {
            try { out("file-out", await api("POST", "/api/files/execute", { filename: name })); }
            catch (e) { out("file-out", "Error: " + e.message); }
        }

        async function delFile(name) {
            try {
                await api("DELETE", "/api/files/" + name);
                out("file-out", "Deleted " + name);
                listFiles();
            } catch (e) { out("file-out", "Error: " + e.message); }
        }
    </script>
</body>
</html>
